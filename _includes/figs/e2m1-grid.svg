<circle class="dot" cx="432.0" cy="56" r="5.5"/>
<circle class="dot" cx="520.0" cy="56" r="5.5"/>
<line class="axis" x1="28" y1="130" x2="540" y2="130"/>
<circle class="grid-pt" cx="40" cy="130" r="4.5"/>
<text class="t-small" x="40" y="156" text-anchor="middle">0</text>
