<line class="snap" x1="232.0" y1="62" x2="200" y2="121" marker-end="url(#e2m1-arrow)"/>
<line class="snap" x1="328.0" y1="62" x2="360" y2="121" marker-end="url(#e2m1-arrow)"/>
<line class="snap" x1="432.0" y1="62" x2="360" y2="121" marker-end="url(#e2m1-arrow)"/>
<line class="snap" x1="520.0" y1="62" x2="520" y2="121" marker-end="url(#e2m1-arrow)"/>
