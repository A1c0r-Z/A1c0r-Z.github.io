<text class="t-label" x="40" y="24">one block, divided by its scale</text>
<text class="t-small t-faint" x="520" y="36" text-anchor="middle">block max</text>
<line class="snap" x1="56.0" y1="62" x2="40" y2="121" marker-end="url(#e2m1-arrow)"/>
