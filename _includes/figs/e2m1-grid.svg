<svg class="fig" viewBox="0 0 560 238" role="img" aria-label="The positive half of the E2M1 grid: 0, 0.5, 1, 1.5, 2, 3, 4, 6. Eight example values of a block, divided by the block scale, are rounded to the nearest grid point.">
