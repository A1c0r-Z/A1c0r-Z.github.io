---
layout: default
---
<article class="post">
  {%- if page.draft %}
  <div class="draft-banner">Draft. This page is being written and is not listed on the site yet.</div>
  {%- endif %}
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
